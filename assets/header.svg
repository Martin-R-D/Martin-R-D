<style>@keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.satellite{transform-origin:0px 0px;animation:orbit 7s linear infinite}.orbit-ring{transform-origin:0px 0px;animation:orbit 24s linear infinite reverse}@media (prefers-reduced-motion:reduce){.satellite,.orbit-ring{animation:none}}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101627"/><stop offset="1" stop-color="#090d17"/></linearGradient><linearGradient id="accent"><stop stop-color="#ae8dff"/><stop offset="1" stop-color="#67e6e3"/></linearGradient><radialGradient id="glow"><stop stop-color="#8c5dff" stop-opacity=".23"/><stop offset="1" stop-color="#8c5dff" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7a8caf" stroke-opacity=".07"/></pattern><clipPath id="clip"><rect width="960" height="340" rx="22"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="960" height="340" fill="url(#bg)"/><rect width="960" height="340" fill="url(#grid)"/><circle cx="756" cy="171" r="235" fill="url(#glow)"/>
