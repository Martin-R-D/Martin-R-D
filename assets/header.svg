<g font-family="Arial, sans-serif"><text x="42" y="46" fill="#adbcdb" font-size="11" letter-spacing="3">MARTIN / DEV</text><text x="918" y="46" text-anchor="end" fill="#8292b1" font-size="10" letter-spacing="2">PERSONAL MISSION CONTROL</text><rect x="42" y="91" width="32" height="3" rx="1.5" fill="url(#accent)"/><text x="39" y="161" fill="#f1f4ff" font-size="60" font-weight="700" letter-spacing="-2">I am Martin.</text><text x="42" y="201" fill="#acb7cf" font-size="18">Turning ideas into working software.</text><rect x="42" y="239" width="206" height="30" rx="15" fill="#9f81ff" fill-opacity=".1" stroke="#554577"/><text x="145" y="259" text-anchor="middle" font-size="11" fill="#c5b3ff" letter-spacing="1">FULL STACK DEVELOPMENT</text><rect x="260" y="239" width="202" height="30" rx="15" fill="#63d8db" fill-opacity=".06" stroke="#2c555f"/><text x="361" y="259" text-anchor="middle" font-size="11" fill="#85e2df" letter-spacing="1">ARTIFICIAL INTELLIGENCE</text><path d="M42 300H918" stroke="#253047"/><text x="42" y="322" fill="#7e8ca7" font-size="10" letter-spacing="2">BUILD / EXPLORE / ITERATE</text><text x="918" y="322" text-anchor="end" fill="#7e8ca7" font-size="10" letter-spacing="2">MARTIN-R-D</text></g></g><rect x=".5" y=".5" width="959" height="339" rx="22" stroke="#2a344c" fill="none"/></svg>