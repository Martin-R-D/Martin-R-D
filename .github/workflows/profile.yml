name: Refresh profile activity
on:
  push:
    branches: [main]
    paths:
      - scripts/render_activity.py
      - .github/workflows/profile.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution timeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/render_activity.py
      - name: Commit refreshed graphic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile activity timeline'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
